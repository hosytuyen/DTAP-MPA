services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${GMAIL_UI_PORT:-8025}:8025"
      - "${GMAIL_SMTP_PORT:-1025}:1025"
    environment:
      MP_UI_BIND_ADDR: "0.0.0.0:8025"
      MP_SMTP_BIND_ADDR: "0.0.0.0:1025"

  user-service:
    image: decodingtrustagent/gmail:service-latest
    restart: unless-stopped
    ports:
      - "${GMAIL_AUTH_PORT:-8030}:8030"
      - "${GMAIL_PROXY_PORT:-8031}:8031"
    security_opt:
      - seccomp:unconfined
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8030/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - gmail_data:/app/data
    environment:
      - MAILPIT_BASE_URL=http://mailpit:8025
      - MAILPIT_SMTP_HOST=mailpit
      - MAILPIT_SMTP_PORT=1025
      - DATABASE_PATH=/app/data/users.db
      - ALLOWED_ORIGINS=*
      - AUTH_PORT=8030
      - PROXY_PORT=8031

  gmail-ui:
    image: decodingtrustagent/gmail:ui-latest
    restart: unless-stopped
    ports:
      - "${GMAIL_FRONTEND_PORT:-8050}:80"
    security_opt:
      - seccomp:unconfined
    depends_on:
      - mailpit
      - user-service
    environment:
      - MAILPIT_API_HOST=mailpit:8025
      - USER_SERVICE_URL=http://user-service:8030
      - API_PROXY_URL=http://user-service:8031
      - GMAIL_FRONTEND_PORT=80

volumes:
  gmail_data:
